<!DOCTYPE html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast Fax Food</title><style>
*{box-sizing:border-box;margin:0}:root{--r:#e63946;--k:#14181f;--m:#6b7280;--b:#f3f5f7;--l:#e2e6ea}
body{font-family:system-ui,"PingFang HK","Noto Sans TC",sans-serif;background:var(--b);color:var(--k);padding-bottom:100px}
button{border:0;font:inherit;cursor:pointer;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--k);color:#fff;transition:.2s}button:hover{transform:translateY(-1px);box-shadow:0 6px 16px #0003}button:active{transform:scale(.94)}button:disabled{opacity:.5;pointer-events:none}
.g2{background:#fff;color:var(--k);border:1px solid var(--l)}.rd{background:var(--r)}
input{width:100%;padding:12px;margin:5px 0 10px;border:1px solid var(--l);border-radius:12px;font:inherit;transition:.2s}input:focus{outline:0;border-color:var(--r);box-shadow:0 0 0 4px #e6394622}
.av{display:grid;place-items:center;color:#fff;font-weight:800;border-radius:14px;flex:none}
.md{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:20;animation:fi .2s}.md[hidden]{display:none}.md>div{background:#fff;padding:22px;border-radius:20px;width:92%;max-width:400px;animation:up .35s cubic-bezier(.2,1.2,.4,1)}
.row{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);background:var(--k);color:#fff;padding:12px 20px;border-radius:99px;z-index:30;animation:ts 3.2s both;font-weight:600}
@keyframes fi{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(20px)}}@keyframes ts{0%{opacity:0;top:-30px}10%,88%{opacity:1;top:16px}100%{opacity:0;top:-30px}}
@keyframes sh{to{background-position:-200% 0}}@keyframes pu{0%{box-shadow:0 0 0 0 #e6394688}100%{box-shadow:0 0 0 12px #e6394600}}@keyframes pop{40%{transform:scale(1.2)}}@keyframes bg{50%{background-position:100% 50%}}@keyframes rd{to{background-position:28px 0}}@keyframes rs{from{left:-50px}to{left:100%}}
.a .it{animation:up .5s var(--d,0s) both}
header{position:sticky;top:0;z-index:5;background:#fffe;backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--l)}
.lg{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;cursor:pointer}.lg i{width:34px;height:34px;border-radius:10px;background:var(--r);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
.bd{background:var(--r);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px;margin-left:8px;animation:pu 1.4s infinite}.bd[hidden]{display:none}
.w{max-width:760px;margin:auto;padding:14px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 22px 40px;color:#fff;background:linear-gradient(120deg,#e63946,#ff7a45,#e63946);background-size:200% 200%;animation:bg 8s ease infinite;margin-bottom:14px}
.hero h2{font-size:28px;line-height:1.2}.hero p{opacity:.9;margin-top:6px}.hero .road{position:absolute;left:0;right:0;bottom:14px;height:3px;background:repeating-linear-gradient(90deg,#fff9 0 14px,transparent 14px 28px);animation:rd .5s linear infinite}.hero svg{position:absolute;bottom:16px;animation:rs 5s linear infinite}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:#fff;border-radius:18px;padding:14px;border:1px solid var(--l)}.sh{display:flex;gap:12px;align-items:center;cursor:pointer;transition:.25s}.sh:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0001}
small{color:var(--m);display:block;margin-top:3px}
.sk{height:86px;border-radius:18px;background:linear-gradient(90deg,#e9edf0 25%,#f6f8f9 50%,#e9edf0 75%);background-size:200% 100%;animation:sh 1.2s infinite}
.mr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--l)}.mr:last-child{border:0}.mr>div:nth-child(2){flex:1}
.q{display:flex;align-items:center;gap:10px}.q button{padding:6px 9px;border-radius:99px}.q b{min-width:18px;text-align:center}
#bar{position:fixed;bottom:14px;left:14px;right:14px;max-width:560px;margin:auto;background:var(--k);color:#fff;padding:12px 14px 12px 20px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;transform:translateY(140%);transition:transform .45s cubic-bezier(.2,1.2,.4,1);z-index:6}#bar.s{transform:none}.pop{animation:pop .3s}
.sr{display:flex;justify-content:space-between;padding:5px 0;color:var(--m)}.sr.t{color:var(--k);font-weight:800;border-top:1px solid var(--l);margin-top:6px;padding-top:10px}
.ln{height:6px;background:var(--l);border-radius:3px;position:relative;margin:30px 14px 12px}.ln b{display:block;height:100%;background:var(--r);border-radius:3px;position:relative;transition:width 1.1s cubic-bezier(.4,0,.2,1)}.ln span{position:absolute;right:-17px;top:-15px;width:34px;height:34px;border-radius:50%;background:var(--r);color:#fff;display:grid;place-items:center;animation:pu 1.6s infinite}
.lb{display:flex;justify-content:space-between}.lb small{font-size:11px;margin:0;text-align:center;flex:1}.lb small.on{color:var(--k);font-weight:700}
.es{text-align:center;color:var(--m);padding:40px 0}
</style></head><body>
<header><div class=lg onclick="go('h')"><i>FFF</i>Fast Fax Food</div><button class=g2 onclick="go('o')">我的訂單<span id=cnt class=bd hidden>0</span></button></header>
<div class=w><input id=se placeholder="搜尋餐廳" oninput="sq(this.value)"><div id=app></div></div>
<div id=bar><span id=bt></span><button class=rd onclick=openCo()>去結帳</button></div>
<div class=md id=co hidden><div><h3 style="margin-bottom:12px">確認訂單</h3><div id=sm style="margin-bottom:14px"></div><input id=cn placeholder=姓名><input id=ph type=tel placeholder=電話><input id=ad placeholder=送餐地址><div class=row><button class=g2 onclick="co.hidden=true">返回</button><button class=rd id=pb onclick=place()>提交訂單</button></div></div></div>
<div class=md id=ap hidden><div><h3 style="margin-bottom:12px">商戶入駐申請</h3><input id=an placeholder=店名><input id=aph type=tel placeholder=聯絡電話><div class=row><button class=g2 onclick="ap.hidden=true">取消</button><button class=rd onclick=apply()>提交申請</button></div></div></div>
<script type=module>
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,collection,addDoc,doc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db=initializeFirestore(initializeApp({apiKey:"AIzaSyDE5ph-uHazh6m0Q4ENeGirLHEI59Cpfhw",authDomain:"uspp1-cd038.firebaseapp.com",projectId:"uspp1-cd038",storageBucket:"uspp1-cd038.firebasestorage.app",messagingSenderId:"118206137592",appId:"1:118206137592:web:00879c764b12eb2e25270d"}),{experimentalAutoDetectLongPolling:true});
const F=10,S=["new","preparing","ready","delivering","done"],SL=["已下單","製作中","等待騎手","配送中","已送達"],$=i=>document.getElementById(i),
esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),
hue=s=>[...String(s)].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360,
av=(n,z=48)=>`<div class=av style="width:${z}px;height:${z}px;font-size:${z/2.3}px;background:linear-gradient(135deg,hsl(${hue(n)} 65% 52%),hsl(${hue(n)+40} 65% 40%))">${esc([...String(n)][0]||"?")}</div>`,
I=d=>`<svg width=18 height=18 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2.4 stroke-linecap=round stroke-linejoin=round>${d}</svg>`,
bike=I('<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-8h4l4 8M10 9H8"/>'),
toast=t=>{const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3300)};
const er=e=>{console.error(e);toast("無法連接資料庫:"+({"permission-denied":"Firestore 規則拒絕存取","unavailable":"網絡連不上 Firebase","failed-precondition":"尚未建立 Firestore 資料庫","not-found":"尚未建立 Firestore 資料庫"}[e.code]||e.message))};
let M=[],ld=0,cur,cart={},cartM,tab="h",q="",O=[],OD={},an=1;const P={};
try{O=JSON.parse(localStorage.ffo||"[]")}catch{}
onSnapshot(collection(db,"merchants"),s=>{M=s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>m.status=="active");ld=1;draw()},e=>{er(e);ld=1;draw()});
const watch=id=>onSnapshot(doc(db,"orders",id),d=>{if(!d.exists())return;const o={id,...d.data()},p=OD[id];OD[id]=o;if(p&&p.status!=o.status)toast(o.mn+":"+SL[S.indexOf(o.status)]);draw()},er);O.forEach(watch);
window.go=(t,m)=>{tab=t;cur=m;an=1;scrollTo(0,0);draw()};window.sq=v=>{q=v;draw()};
const tot=()=>Object.values(cart).reduce((a,x)=>a+x.p*x.q,0),cnt=()=>Object.values(cart).reduce((a,x)=>a+x.q,0);
function bar(){const c=cnt();$("bar").classList.toggle("s",c>0);$("bt").innerHTML=`<b>${c}</b> 件 · $${tot()}`;$("bt").classList.remove("pop");void $("bt").offsetWidth;$("bt").classList.add("pop")}
window.add=i=>{const m=M.find(x=>x.id==cur),x=m.menu[i];if(cartM!=cur){if(cnt()&&!confirm("購物車內有其他商戶的餐點,要清空嗎?"))return;cart={};cartM=cur}cart[i]=cart[i]||{n:x.n,p:x.p,q:0};cart[i].q++;bar();draw()};
window.dec=i=>{if(--cart[i].q<=0)delete cart[i];bar();draw()};
window.openCo=()=>{let p={};try{p=JSON.parse(localStorage.ffp||"{}")}catch{}$("cn").value=p.n||"";$("ph").value=p.p||"";$("ad").value=p.a||"";
$("sm").innerHTML=Object.values(cart).map(x=>`<div class=sr><span>${esc(x.n)} × ${x.q}</span><span>$${x.p*x.q}</span></div>`).join("")+`<div class=sr><span>運費</span><span>$${F}</span></div><div class="sr t"><span>合計</span><span>$${tot()+F}</span></div>`;co.hidden=false};
window.place=async()=>{const n=$("cn").value.trim(),p=$("ph").value.trim(),a=$("ad").value.trim();
if(!n||!a||!/^[\d+\s-]{8,}$/.test(p)||!cnt())return toast("請填妥姓名、有效電話及地址");
const b=$("pb");b.disabled=true;try{const m=M.find(x=>x.id==cartM);if(!m)throw 0;
const r=await addDoc(collection(db,"orders"),{mid:m.id,mn:m.name,items:Object.values(cart),total:tot()+F,cn:n,ph:p,ad:a,status:"new",t:serverTimestamp()});
localStorage.ffp=JSON.stringify({n,p,a});O.push(r.id);localStorage.ffo=JSON.stringify(O.slice(-30));watch(r.id);cart={};cartM=null;bar();$("bar").classList.remove("s");co.hidden=true;toast("訂單已提交");go("o")}catch{toast("提交失敗,請再試一次")}b.disabled=false};
window.apply=async()=>{const n=$("an").value.trim(),p=$("aph").value.trim();if(!n||!p)return toast("請填寫店名及電話");await addDoc(collection(db,"merchants"),{name:n,ph:p,status:"pending",menu:[],t:serverTimestamp()});ap.hidden=true;$("an").value=$("aph").value="";toast("申請已提交,審批後會提供帳號")};
const eta=k=>["預計 25–35 分鐘送達","餐廳製作中,預計 20–30 分鐘","餐點完成,等待騎手取餐","騎手正在送來,約 10 分鐘","已送達,祝你用餐愉快"][k];
function draw(){const a=$("app"),c=O.filter(i=>OD[i]&&OD[i].status!="done").length;$("cnt").textContent=c;$("cnt").hidden=!c;$("se").hidden=!(tab=="h"&&!cur);a.className=an?"a":"";an=0;let h="";
if(tab=="o"){const L=O.map(i=>OD[i]).filter(Boolean).reverse();h=`<button class=g2 onclick="go('h')">${I('<path d="M15 18l-6-6 6-6"/>')} 返回</button><h2 style="margin:16px 0 8px">我的訂單</h2>`+(L.map((o,i)=>{const k=Math.max(0,S.indexOf(o.status));return `<div class="card it" style="--d:${i*.07}s;margin:10px 0"><div style="display:flex;justify-content:space-between"><b>${esc(o.mn)}</b><span>$${o.total}</span></div><small>#${o.id.slice(0,5).toUpperCase()} · ${o.items.map(i=>esc(i.n)+" × "+i.q).join("、")}</small><div class=ln><b data-k="${o.id}" data-w="${k/4*100}" style="width:${P[o.id]||0}%">${k<4?`<span>${bike}</span>`:""}</b></div><div class=lb>${SL.map((s,j)=>`<small class="${j<=k?"on":""}">${s}</small>`).join("")}</div><p style="margin-top:14px;font-weight:700">${eta(k)}</p>${o.rn?`<small>騎手 ${esc(o.rn)}</small>`:""}</div>`}).join("")||`<div class=es>還沒有訂單</div>`)}
else if(cur&&M.find(x=>x.id==cur)){const m=M.find(x=>x.id==cur);h=`<button class=g2 onclick="go('h')">${I('<path d="M15 18l-6-6 6-6"/>')} 返回</button><div class=it style="display:flex;gap:14px;align-items:center;margin:16px 0">${av(m.name,64)}<div><h2>${esc(m.name)}</h2><small>營業中 · 運費 $${F} · 約 30 分鐘</small></div></div><div class="card it" style="--d:.1s">`+(m.menu.map((x,i)=>`<div class=mr>${av(x.n,46)}<div><b>${esc(x.n)}</b><small>$${x.p}</small></div>${cart[i]&&cartM==cur?`<div class=q><button class=g2 onclick="dec(${i})">${I('<path d="M5 12h14"/>')}</button><b>${cart[i].q}</b><button onclick="add(${i})">${I('<path d="M12 5v14M5 12h14"/>')}</button></div>`:`<button onclick="add(${i})">加入</button>`}</div>`).join("")||`<div class=es>餐廳尚未上架餐點</div>`)+"</div>"}
else{cur=null;const L=M.filter(m=>m.name.toLowerCase().includes(q.toLowerCase()));
h=`<div class="hero it"><h2>今日想食咩?<br>熱辣辣送到你門口</h2><p>${ld?M.length+" 間餐廳營業中":"載入中…"}</p><div class=road></div>${bike.replace("width=18 height=18",'width=26 height=26')}</div><div class=g>`+(ld?L.map((m,i)=>`<div class="card sh it" style="--d:${i*.06}s" onclick="go('h','${m.id}')">${av(m.name,56)}<div><b>${esc(m.name)}</b><small>${m.menu.length} 款餐點 · 約 30 分鐘</small></div></div>`).join(""):'<div class=sk></div>'.repeat(4))+`</div>`+(ld&&!L.length?`<div class=es>找不到符合的餐廳</div>`:"")+`<p style="margin-top:26px;text-align:center"><button class=g2 onclick="ap.hidden=false">我是商戶,申請入駐</button></p>`}
a.innerHTML=h;requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll("[data-w]").forEach(e=>{P[e.dataset.k]=+e.dataset.w;e.style.width=e.dataset.w+"%"})))}
draw();
</script></body></html>
